[package]
name = "redsamurai-config"
version = "1.0.0"
edition = "2021"
description = "RED SAMURAI 16400DPI Gaming Mouse configuration and resident tray tool"
license = "MIT"

[[bin]]
name = "OpenRedSamurai-Setup"
path = "src/bin/installer.rs"

[features]
# Keep AccessKit enabled in normal builds so stable AuthorId values reach
# Windows UI Automation.  The feature can be disabled by embedders that do not
# need accessibility metadata; the registration helpers then remain no-ops for
# the platform-specific AuthorId field.
default = ["accesskit"]
accesskit = ["egui/accesskit", "eframe/accesskit"]

[dependencies]
eframe = "0.29"
egui = "0.29"
encoding_rs = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "bmp"] }
rfd = "0.15"
dirs = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2.12.1", features = ["json"] }
zip = { version = "1.1.4", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_UI_Input",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.dependencies]
# The configuration endpoint is a Windows HID interface.  Keep the backend
# explicit so another hidapi backend cannot accidentally be selected for it.
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
tray-icon = { version = "0.24.2", default-features = false }
winit = "0.30"
winreg = "0.55"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 2
lto = false
